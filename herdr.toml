# herdr configuration — ported from tmux.conf to keep muscle memory intact.
# https://herdr.dev/docs/configuration/
# Docs: `herdr --default-config` prints every key with its default, commented out.

onboarding = false

# Terminal-palette theme, matching the old tmux setup (bg=default,
# fg=default, ANSI blue accents). Grafted from Omarchy's herdr defaults.
[theme]
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so
# panel_bg has to be dark for it to read.
panel_bg = "black"

[keys]
prefix = "ctrl+a"

# tmux: `bind | split-window -h` (side-by-side) / `bind - split-window -v` (stacked)
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# Direct (no prefix) — cycle agents by attention/order, not tied to pane focus.
next_agent = "ctrl+shift+down"
previous_agent = "ctrl+shift+up"

[terminal]
# tmux: both split bindings pass -c "#{pane_current_path}"
new_cwd = "follow"

[ui]
# tmux: `set -g mouse on` + copy-mode-vi's v/y select-and-yank. herdr has no
# vi keytable for keyboard copy-mode (prefix+[ enters it, but the in-mode keys
# aren't configurable), so mouse drag-to-copy is the closest equivalent.
mouse_capture = true
copy_on_select = true

# Old tmux-themepack used blue powerline accents; Omarchy's terminal theme
# accent is blue too.
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles equivalent — this is what Hyprland shows in the group
# bar, and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

# vim-herdr-navigation: Ctrl+h/j/k/l crosses between herdr panes and
# Neovim splits as one grid (vim-tmux-navigator, ported).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# herdr-sessionizer: fzf project/worktree picker (tmux-sessionizer, ported).
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.open"
description = "open project workspace"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "open worktree workspace"
