# mise finds this file via MISE_CONFIG_DIR=$HOME/.dotfiles (exported from
# zshenv/bashrc): the repo root IS the global mise config dir, so relative
# dotfile sources resolve here and no symlinks are needed on any machine.
# The omarchy layer lives in config.omarchy.toml beside it, selected by
# MISE_ENV (path guard in zshenv/bashrc). `mise use -g` writes tool pins
# straight into this file (in git).
[tools]
node = "26.9.0"
# JS toolchain, unified across hosts (claw had node/npm/bun from pacman,
# pnpm nowhere; this box had only node). bun pinned to what claw already
# runs; pnpm is new capability. `mise install` on each host.
bun = "1.4.2"
pnpm = "latest"
java = "25"

# Dotfiles ownership — managed by `mise bootstrap dotfiles`.
# Docs: https://mise.jdx.dev/dotfiles.html
#
# Migrated from dotbot's install.conf.yaml (stage 1; dotbot still owns the
# shell blocks: git submodules, nvim plugin sync, macOS LaunchAgents).
# Default mode is symlink; explicit where it matters.
[dotfiles]
"~/.profile" = "profile"
"~/.bash_profile" = "bash_profile"
"~/.bashrc" = "bashrc"
"~/.bash_logout" = "bash_logout"
"~/.gitconfig" = "gitconfig"
"~/.gitshrc" = "gitshrc"
"~/.ssh/config" = { source = "ssh/config" }
"~/.config/nvim" = { source = "nvim" }
"~/.tmux.conf" = "tmux.conf"
"~/.config/tmux/tmux.conf" = { source = "tmux.conf" }
"~/.tmux" = "tmux"
"~/.config/herdr/config.toml" = { source = "herdr.toml" }
"~/.zshenv" = "zshenv"
"~/.zprofile" = "zprofile"
"~/.p10k.zsh" = "p10k.zsh"
"~/.zshrc" = "zshrc"
"~/.zsh_plugins.txt" = "zsh_plugins.txt"
"~/.antidote" = { source = "antidote" }
# Every script in the repo dir gets linked; new scripts propagate on apply.
"~/.local/bin" = { source = "local/bin", mode = "symlink-each" }

[settings.upgrade]
