# dotbot's remaining job after the mise migration: machine-setup hooks that
# are NOT dotfile ownership. All dotfile links are owned by the tracked
# [dotfiles] table in config.toml, applied by `mise bootstrap dotfiles apply`.
# (The Omarchy .local copies moved to the mise `omarchy` config environment:
# config.omarchy.toml, selected by the MISE_ENV path guard in zshenv.)

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - [nvim --headless "+Lazy! sync" +qa, Installing nvim plugins]
  - command: |
      if [ "$(uname)" = "Darwin" ]; then
        mkdir -p ~/Library/LaunchAgents
        for f in "$PWD"/macos/LaunchAgents/*.plist; do
          ln -sfn "$f" ~/Library/LaunchAgents/"$(basename "$f")"
        done
      fi
    description: Link macOS LaunchAgents
