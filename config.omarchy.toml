# Omarchy-only dotfiles — layered on top of config.toml when the `omarchy`
# config environment is selected (`mise -E omarchy ...` or MISE_ENV=omarchy).
# Machines select it via a path guard in zshenv/bashrc ([[ -d /usr/share/omarchy ]]),
# keeping the repo self-describing. Shared platform defaults are symlinked;
# ~/.zshrc.local, ~/.zshenv.local and ~/.tmux.conf.local are never managed.
[dotfiles]
"~/.config/dotfiles/omarchy" = { source = "omarchy" }
